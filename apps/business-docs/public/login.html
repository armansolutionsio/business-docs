<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arman — Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
      background:radial-gradient(1200px 600px at 20% 10%,#1f2a44,#0b0f1a 70%);
      color:#e8edf5;display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .card{
      background:linear-gradient(135deg,#19233d,#111a2e);
      border:1px solid #2a3656;border-radius:16px;padding:36px 32px;
      width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.3);
    }
    h1{font-size:22px;font-weight:600;margin-bottom:6px}
    .sub{color:#8ea0c2;font-size:13px;margin-bottom:24px}
    label{display:block;font-size:12px;color:#9aabcf;margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px}
    input{
      width:100%;padding:11px 13px;border-radius:9px;border:1px solid #2c3a5e;
      background:#0e1628;color:#e8edf5;font-size:14px;outline:none;
    }
    input:focus{border-color:#5b7bd6}
    button{
      width:100%;margin-top:22px;padding:12px;border-radius:9px;border:0;
      background:linear-gradient(135deg,#5b7bd6,#4863b8);color:white;font-weight:600;
      font-size:14px;cursor:pointer;transition:opacity .15s;
    }
    button:hover{opacity:.9}
    button:disabled{opacity:.5;cursor:wait}
    .err{margin-top:14px;color:#ff8a8a;font-size:13px;min-height:18px}
    .info{margin-top:14px;color:#ffd57a;font-size:13px;min-height:18px}
  </style>
</head>
<body>
  <form class="card" id="f">
    <h1>Arman Suite</h1>
    <div class="sub">Iniciar sesion</div>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />

    <button type="submit" id="btn">Ingresar</button>
    <div class="info" id="info"></div>
    <div class="err" id="err"></div>
  </form>

  <script src="/_shared/auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('expired') === '1') {
      document.getElementById('info').textContent = 'Tu sesion expiro, por favor ingresa de nuevo.';
    }
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Ingresando...';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error');
        ArmanAuth.setSession(data.token, data.user);
        const next = params.get('next') || '/';
        location.href = next;
      } catch (ex) {
        err.textContent = ex.message;
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
