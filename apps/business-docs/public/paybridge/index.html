<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayBridge — Links de cobro</title>
  <link rel="stylesheet" href="/_shared.css" />
  <script src="/_shared/auth.js"></script>
  <script>ArmanAuth.requireSession({ vertical: 'paybridge' });</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand" style="padding:4px 0 14px">
      <img src="/Logo%20PayBridge.png" alt="PayBridge" style="width:100%;max-width:170px;height:auto;display:block;margin:0 auto 4px"/>
    </div>
    <a data-tab="dashboard" class="active">Dashboard</a>
    <a data-tab="links">Payment Links</a>
    <a data-tab="transactions">Transacciones</a>
    <a data-tab="contactos">Clientes</a>
    <a data-tab="stripeImport">Importar Stripe</a>
    <a data-tab="tareas">Tareas</a>
    <a data-tab="notas">Notas</a>
    <a data-tab="fees">Fee rules</a>
    <a data-tab="monedas">Monedas</a>
    <div class="back"><a href="/" class="back-btn"><span class="arrow">←</span><span>Volver al hub</span></a></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
const API = '/api/paybridge';
const $ = (s, p = document) => p.querySelector(s);
const fmt = (n, c = 'USD') => { try { return new Intl.NumberFormat('es-AR', { style:'currency', currency:c }).format(Number(n||0)); } catch { return `${c} ${Number(n||0).toFixed(2)}`; } };
const fmtDate = (d) => d ? new Date(d).toLocaleString('es-AR') : '—';
async function api(p, o = {}) {
  const r = await fetch(API + p, { headers: {'Content-Type':'application/json'}, ...o });
  if (!r.ok) throw new Error((await r.json()).error || r.statusText);
  return r.json();
}
function tag(estado) {
  const m = { activo:'green', completado:'green', pagado:'green', pendiente:'amber', cancelado:'red', expirado:'red' };
  return `<span class="tag ${m[estado]||''}">${estado||'—'}</span>`;
}

const state = { editingContacto: null, clienteId: null, txCache: [] };

const tabs = {
  async dashboard() {
    const today = new Date().toISOString().slice(0, 10);
    const monthAgo = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
    return `
      <div class="head"><h2>Dashboard PayBridge</h2></div>
      <div class="card" style="margin-bottom:12px">
        <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div><label style="font-size:11px;color:#8ea0c2">Desde</label>
            <input id="db-from" type="date" value="${monthAgo}" onchange="ui.applyDashboardFilter()" max="${today}"/>
          </div>
          <div><label style="font-size:11px;color:#8ea0c2">Hasta</label>
            <input id="db-to" type="date" value="${today}" onchange="ui.applyDashboardFilter()" max="${today}"/>
          </div>
          <span id="db-loading" style="color:#7fb1ff;font-size:12px;display:none">cargando…</span>
        </div>
        <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:10px">
          <span style="font-size:11px;color:#8ea0c2;align-self:center;margin-right:4px">Atajos:</span>
          <button class="btn ghost btn-preset" onclick="ui.setDashboardPreset('today')">Hoy</button>
          <button class="btn ghost btn-preset" onclick="ui.setDashboardPreset('week')">Esta semana</button>
          <button class="btn ghost btn-preset" onclick="ui.setDashboardPreset('month')">Este mes</button>
          <button class="btn ghost btn-preset" onclick="ui.setDashboardPreset('lastMonth')">Mes pasado</button>
          <button class="btn ghost btn-preset" onclick="ui.setDashboardPreset('30d')">Últimos 30d</button>
          <button class="btn ghost btn-preset" onclick="ui.setDashboardPreset('90d')">Últimos 90d</button>
          <button class="btn ghost btn-preset" onclick="ui.setDashboardPreset('ytd')">Año actual</button>
          <button class="btn ghost btn-preset" onclick="ui.setDashboardPreset('all')">Todo el histórico</button>
        </div>
      </div>
      <div id="db-body"><div class="card empty">Cargando…</div></div>
    `;
  },
  async links() {
    const data = await api('/links');
    return `
      <div class="head"><h2>Payment Links</h2><button class="btn" onclick="ui.newLink()">+ Agregar link de Stripe</button></div>
      <div class="card">
        <table><thead><tr><th>Link</th><th>Cliente</th><th>Descripción</th><th>Monto</th>
          <th>Estado</th><th>Acciones</th></tr></thead><tbody>
        ${data.map(l => {
          const externalUrl = l.url || ('/pay/' + l.slug);
          return `<tr>
            <td>
              ${l.external_id ? `<code style="font-size:11px">${l.external_id}</code>` : `<code>${l.slug}</code>`}
            </td>
            <td>${l.contacto_id
              ? `<a href="javascript:void(0)" onclick="render('cliente', ${l.contacto_id})" style="color:#7fb1ff;text-decoration:none">${(l.cliente_nombre||'').replace(/</g,'&lt;')}</a>`
              : '<span style="color:#6e82a9">—</span>'}</td>
            <td>${(l.descripcion || '—').replace(/</g,'&lt;')}</td>
            <td><b>${fmt(l.monto, l.moneda)}</b></td>
            <td>${tag(l.estado)}</td>
            <td style="white-space:nowrap">
              <button class="btn ghost" onclick="ui.copyLinkUrl('${externalUrl.replace(/'/g,"\\'")}', this)">Copiar</button>
              <a class="btn ghost" href="${externalUrl}" target="_blank" style="text-decoration:none">Abrir</a>
              <button class="btn ghost" onclick='ui.editLink(${JSON.stringify(l).replace(/'/g,"&#39;")})'>Editar</button>
              <button class="btn ghost" style="color:#ff8a8a" onclick="ui.deleteLink(${l.id})">Borrar</button>
            </td></tr>`;
        }).join('') || `<tr><td colspan="6" class="empty">Sin links. Generá uno en Stripe y agregalo con el botón de arriba.</td></tr>`}
        </tbody></table>
      </div>`;
  },
  async transactions() {
    const data = await api('/transactions');
    return `
      <div class="head"><h2>Transacciones</h2></div>
      <div class="card">
        <table><thead><tr><th>Fecha</th><th>Link</th><th>Pagador</th>
          <th>Bruto</th><th>Fee</th><th>Neto</th><th>Estado</th></tr></thead><tbody>
        ${data.map(t => `<tr><td>${fmtDate(t.completado_at || t.created_at)}</td>
          <td><code>${t.link_slug || '—'}</code></td>
          <td>${t.payer_nombre || t.payer_email || '—'}</td>
          <td>${fmt(t.monto_bruto, t.moneda)}</td><td>${fmt(t.fee, t.moneda)}</td>
          <td><b>${fmt(t.monto_neto, t.moneda)}</b></td><td>${tag(t.estado)}</td></tr>`).join('')
          || `<tr><td colspan="7" class="empty">Sin transacciones</td></tr>`}
        </tbody></table>
      </div>`;
  },
  async contactos() {
    const data = await api('/contactos');
    return `
      <div class="head"><h2>Clientes</h2><button class="btn" onclick="ui.newContacto()">+ Nuevo</button></div>
      <div class="card">
        <p style="color:#8ea0c2;font-size:12px;margin-bottom:10px">Cliente PayBridge: registramos sus datos, link de cobros generados, comisiones efectivas y datos de DolarApp para asesoramiento.</p>
        <table><thead><tr><th>Nombre</th><th>Email</th><th>DolarApp alias</th><th>País</th><th>Estado</th><th></th></tr></thead><tbody>
        ${data.map(c => `<tr>
          <td>
            <a href="javascript:void(0)" onclick="render('cliente', ${c.id})" style="color:#7fb1ff;text-decoration:none;font-weight:600">
              ${(c.nombre||'').replace(/</g,'&lt;')}
            </a>
            ${c.razon_social?'<br><small style="color:#6e82a9">'+(c.razon_social||'').replace(/</g,'&lt;')+'</small>':''}
          </td>
          <td>${c.email||'—'}</td>
          <td>${c.dolarapp_alias||'—'}</td>
          <td>${c.pais||'—'}</td>
          <td>${tag(c.estado)}</td>
          <td>
            <button class="btn ghost" onclick="render('cliente', ${c.id})">Ver</button>
            <button class="btn ghost" onclick='ui.editContacto(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Editar</button>
          </td>
        </tr>`).join('') || `<tr><td colspan="6" class="empty">Sin clientes</td></tr>`}
        </tbody></table>
      </div>`;
  },

  async stripeImport() {
    const [txImports, linkImports] = await Promise.all([
      api('/stripe-imports').catch(() => []),
      api('/stripe-links-imports').catch(() => []),
    ]);
    return `
      <div class="head"><h2>Importar reportes Stripe</h2></div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px">

        <div class="card">
          <h3 style="font-size:14px;margin-bottom:8px;color:#cfe1ff">Reporte de transacciones</h3>
          <p style="color:#8ea0c2;font-size:12px;margin-bottom:12px">
            CSV/XLSX con los cobros del período. Asigna por <code>product_names</code> (formato <code>nombre.apellido</code>),
            o por <code>product_ids</code> si no hay nombre. Dedupe por <code>charge_id</code> y <code>payment_intent_id</code>.
          </p>
          <input id="si-file" type="file" accept=".csv,.xlsx,.xls" style="margin-bottom:10px"/>
          <div><button class="btn" onclick="ui.uploadStripe()">Importar transacciones</button>
            <span id="si-status" style="margin-left:12px;color:#8ea0c2;font-size:12px"></span></div>
          <div id="si-result" style="margin-top:14px"></div>
        </div>

        <div class="card">
          <h3 style="font-size:14px;margin-bottom:8px;color:#cfe1ff">Reporte de Payment Links</h3>
          <p style="color:#8ea0c2;font-size:12px;margin-bottom:12px">
            CSV/XLSX con los links de pago de Stripe. Trae <code>id</code>, <code>url</code>, <code>active</code>, <code>amount</code>,
            <code>currency</code>. Dedupe por <code>id</code> (Stripe). Si la fila trae <code>product_names</code>, se vincula al cliente.
          </p>
          <input id="sl-file" type="file" accept=".csv,.xlsx,.xls" style="margin-bottom:10px"/>
          <div><button class="btn" onclick="ui.uploadStripeLinks()">Importar payment links</button>
            <span id="sl-status" style="margin-left:12px;color:#8ea0c2;font-size:12px"></span></div>
          <div id="sl-result" style="margin-top:14px"></div>
        </div>

      </div>

      <div class="card" style="margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:10px">Imports de transacciones</h3>
        <table><thead><tr><th>Fecha</th><th>Archivo</th><th>Total</th><th>Importadas</th>
          <th>Duplicadas</th><th>Skip</th><th>Clientes nuevos</th><th>Período</th><th>Usuario</th></tr></thead>
        <tbody>${txImports.map(i => `<tr>
          <td>${fmtDate(i.created_at)}</td>
          <td>${(i.file_name||'—').replace(/</g,'&lt;')}</td>
          <td>${i.rows_total}</td>
          <td><b>${i.rows_imported}</b></td>
          <td>${i.rows_duplicated}</td>
          <td>${i.rows_skipped}</td>
          <td>${i.contactos_creados}</td>
          <td>${i.period_from?fmtDate(i.period_from).split(',')[0]:'—'} → ${i.period_to?fmtDate(i.period_to).split(',')[0]:'—'}</td>
          <td>${i.usuario||'—'}</td>
        </tr>`).join('') || `<tr><td colspan="9" class="empty">Sin imports previos</td></tr>`}
        </tbody></table>
      </div>

      <div class="card" style="margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:10px">Imports de payment links</h3>
        <table><thead><tr><th>Fecha</th><th>Archivo</th><th>Total</th><th>Nuevos</th>
          <th>Actualizados</th><th>Skip</th><th>Clientes nuevos</th><th>Usuario</th></tr></thead>
        <tbody>${linkImports.map(i => `<tr>
          <td>${fmtDate(i.created_at)}</td>
          <td>${(i.file_name||'—').replace(/</g,'&lt;')}</td>
          <td>${i.rows_total}</td>
          <td><b>${i.rows_imported}</b></td>
          <td>${i.rows_updated}</td>
          <td>${i.rows_skipped}</td>
          <td>${i.contactos_creados}</td>
          <td>${i.usuario||'—'}</td>
        </tr>`).join('') || `<tr><td colspan="8" class="empty">Sin imports previos</td></tr>`}
        </tbody></table>
      </div>`;
  },

  async cliente(id) {
    state.clienteId = id;
    let c;
    try { c = await api('/contactos/' + id); }
    catch (e) { return `<div class="card"><b style="color:#ff8a8a">Cliente ${id} no encontrado.</b></div>`; }

    const today = new Date().toISOString().slice(0, 10);
    const monthAgo = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);

    return `
      <div class="head" style="align-items:center">
        <div>
          <button class="btn ghost" onclick="render('contactos')" style="margin-right:8px">← Volver</button>
          <h2 style="display:inline-block;margin:0">${(c.nombre||'').replace(/</g,'&lt;')} ${(c.apellido||'').replace(/</g,'&lt;')}</h2>
          <small style="color:#6e82a9;margin-left:8px">${c.email||''}${c.pais?' · '+c.pais:''}${c.dolarapp_alias?' · ARQ: '+c.dolarapp_alias:''}</small>
        </div>
        <div></div>
      </div>

      <div class="card" style="margin-bottom:12px">
        <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div><label style="font-size:11px;color:#8ea0c2">Desde</label>
            <input id="cl-from" type="date" value="${monthAgo}" onchange="ui.applyFilter()" max="${today}"/>
          </div>
          <div><label style="font-size:11px;color:#8ea0c2">Hasta</label>
            <input id="cl-to" type="date" value="${today}" onchange="ui.applyFilter()" max="${today}"/>
          </div>
          <button class="btn success" onclick="ui.downloadStatementPdf()">Descargar PDF</button>
          <button class="btn ghost" onclick="ui.togglePdfOptions()">Personalizar PDF</button>
          <span id="cl-loading" style="color:#7fb1ff;font-size:12px;display:none">cargando…</span>
        </div>
        <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:10px">
          <span style="font-size:11px;color:#8ea0c2;align-self:center;margin-right:4px">Atajos:</span>
          <button class="btn ghost btn-preset" onclick="ui.setPreset('today')">Hoy</button>
          <button class="btn ghost btn-preset" onclick="ui.setPreset('week')">Esta semana</button>
          <button class="btn ghost btn-preset" onclick="ui.setPreset('month')">Este mes</button>
          <button class="btn ghost btn-preset" onclick="ui.setPreset('lastMonth')">Mes pasado</button>
          <button class="btn ghost btn-preset" onclick="ui.setPreset('30d')">Últimos 30d</button>
          <button class="btn ghost btn-preset" onclick="ui.setPreset('90d')">Últimos 90d</button>
          <button class="btn ghost btn-preset" onclick="ui.setPreset('ytd')">Año actual</button>
          <button class="btn ghost btn-preset" onclick="ui.setPreset('all')">Todo el histórico</button>
        </div>

        <div id="cl-pdf-opts" style="display:none;margin-top:14px;padding:12px 14px;background:#0f2235;border-radius:8px;border:1px solid #1f3358">
          <div style="font-size:11px;color:#8ea0c2;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">
            Fee PayBridge
          </div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
            <label style="font-size:12px;color:#cfe1ff;text-transform:none;letter-spacing:0">
              % a cobrar sobre el subtotal (post Stripe):
            </label>
            <input id="cl-fee-pct" type="number" step="0.1" min="0" max="100" placeholder="0"
              style="width:90px;background:#0f1729;border:1px solid #1f3358;color:#e8eefc;padding:6px 8px;border-radius:6px"
              value=""/>
            <span style="font-size:11px;color:#8ea0c2">%</span>
            <span style="font-size:11px;color:#8ea0c2;margin-left:6px">
              · Vacío o 0 = sin Fee PayBridge en el PDF
            </span>
          </div>
          <div style="font-size:11px;color:#8ea0c2;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">
            Links de pago
          </div>
          <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#cfe1ff;text-transform:none;letter-spacing:0">
              <input type="checkbox" id="pdf-links-activos" style="width:auto;margin:0"/>Incluir links <b style="color:#7fe6b1">activos</b>
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#cfe1ff;text-transform:none;letter-spacing:0">
              <input type="checkbox" id="pdf-links-inactivos" style="width:auto;margin:0"/>Incluir links <b style="color:#ff8a8a">inactivos</b>
            </label>
          </div>
          <div style="font-size:11px;color:#8ea0c2;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">
            Agregar al PDF (opcional)
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 14px;font-size:12px">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="avg"/>Promedio bruto (moneda principal)
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="topCurrency"/>Moneda dominante
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="topCountry"/>País dominante
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="peakMonth"/>Mes pico
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="dailyAvg"/>Promedio diario
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="trend"/>Variación vs período previo
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="top3"/>Top 3 cobros del período
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="cardBrand"/>Distribución por marca de tarjeta
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="weekday"/>Cobros por día de la semana
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
              <input type="checkbox" class="pdf-opt" value="avgPerCurrency"/>Promedio y mediana por moneda
            </label>
          </div>
        </div>
      </div>

      <div id="cl-body"><div class="card empty">Cargando…</div></div>
    `;
  },
  async tareas() {
    const items = await api('/crm/tareas');
    return `<div class="head"><h2>Tareas</h2><button class="btn" onclick="ui.newTarea()">+ Nueva tarea</button></div>
      <div class="card">
        <table><thead><tr><th>Título</th><th>Contacto</th><th>Estado</th><th>Prioridad</th><th>Asignado</th><th>Fecha límite</th><th></th></tr></thead><tbody>
        ${items.map(t => `<tr>
          <td><b>${(t.titulo||'').replace(/</g,'&lt;')}</b></td>
          <td>${t.contacto_nombre||'—'}</td>
          <td><span class="tag ${t.estado==='completada'?'green':''}">${t.estado}</span></td>
          <td>${t.prioridad||'normal'}</td>
          <td>${t.asignado_a||'—'}</td>
          <td>${t.fecha_limite ? fmtDate(t.fecha_limite) : '—'}</td>
          <td>${t.estado!=='completada'?'<button class="btn ghost" onclick="ui.completarTarea('+t.id+')">Completar</button>':''}</td>
        </tr>`).join('') || '<tr><td colspan="7" class="empty">Sin tareas</td></tr>'}
        </tbody></table>
      </div>`;
  },
  async notas() {
    const contactos = await api('/contactos');
    return `<div class="head"><h2>Notas por cliente</h2></div>
      <div class="card">
        <select id="nt-cid" onchange="ui.loadNotas(this.value)">
          <option value="">— Elegir cliente —</option>
          ${contactos.map(c => `<option value="${c.id}">${(c.nombre||'').replace(/</g,'&lt;')}</option>`).join('')}
        </select>
      </div>
      <div id="nt-box"></div>`;
  },
  async fees() {
    const data = await api('/fee-rules');
    return `
      <div class="head"><h2>Fee rules</h2><button class="btn" onclick="ui.newFee()">+ Nueva</button></div>
      <div class="card">
        <table><thead><tr><th>Nombre</th><th>Moneda</th><th>% Fee</th><th>Fee fijo</th><th>Min</th><th>Max</th></tr></thead><tbody>
        ${data.map(f => `<tr><td>${f.nombre}</td><td>${f.moneda||'*'}</td>
          <td>${f.fee_pct}%</td><td>${f.fee_fijo}</td>
          <td>${f.minimo||'—'}</td><td>${f.maximo||'—'}</td></tr>`).join('')}
        </tbody></table>
      </div>`;
  },
  async monedas() {
    const data = await api('/monedas');
    return `
      <div class="head"><h2>Monedas soportadas</h2></div>
      <div class="card">
        <table><thead><tr><th>Code</th><th>Nombre</th><th>Símbolo</th><th>Tipo</th></tr></thead><tbody>
        ${data.map(m => `<tr><td><b>${m.code}</b></td><td>${m.nombre}</td>
          <td>${m.simbolo}</td><td>${m.es_cripto ? '<span class="tag amber">Cripto</span>' : '<span class="tag">Fiat</span>'}</td></tr>`).join('')}
        </tbody></table>
      </div>`;
  },
};

const ui = {
  // modal({ title, body, footer }) — UX consistente con head/body/foot
  modal(opts) {
    const { title, body, footer } = (typeof opts === 'string') ? { title: '', body: opts, footer: '' } : opts;
    let bg = $('#mb');
    if (!bg) { bg = document.createElement('div'); bg.id='mb'; bg.className='modal-bg'; document.body.appendChild(bg); }
    bg.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>${title || ''}</h3>
          <button class="close" onclick="ui.closeModal()" aria-label="Cerrar">×</button>
        </div>
        <div class="modal-body">${body || ''}</div>
        ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
      </div>`;
    bg.classList.add('open');
    bg.onclick = e => { if (e.target===bg) ui.closeModal(); };
    document.addEventListener('keydown', ui._escClose);
  },

  // ── Cliente detalle ─────────────────────────────────────────────
  _filterQs() {
    const from = $('#cl-from')?.value || '';
    const to = $('#cl-to')?.value || '';
    const parts = [];
    if (from) parts.push('from=' + encodeURIComponent(from));
    if (to)   parts.push('to=' + encodeURIComponent(to + 'T23:59:59'));
    return parts.length ? '?' + parts.join('&') : '';
  },

  applyFilter() {
    if (state.clienteId) ui.loadClienteStats(state.clienteId);
  },

  setPreset(kind) {
    const from = $('#cl-from'), to = $('#cl-to');
    if (!from || !to) return;
    const now = new Date();
    const fmt = d => d.toISOString().slice(0, 10);
    const today = fmt(now);
    if (kind === 'all') {
      from.value = '';
      to.value = '';
    } else if (kind === 'today') {
      from.value = today; to.value = today;
    } else if (kind === 'week') {
      const dow = (now.getDay() + 6) % 7; // lun=0
      const wkStart = new Date(now); wkStart.setDate(now.getDate() - dow);
      from.value = fmt(wkStart); to.value = today;
    } else if (kind === 'month') {
      from.value = fmt(new Date(now.getFullYear(), now.getMonth(), 1));
      to.value = today;
    } else if (kind === 'lastMonth') {
      from.value = fmt(new Date(now.getFullYear(), now.getMonth() - 1, 1));
      to.value = fmt(new Date(now.getFullYear(), now.getMonth(), 0));
    } else if (kind === '30d') {
      from.value = fmt(new Date(Date.now() - 30 * 86400000)); to.value = today;
    } else if (kind === '90d') {
      from.value = fmt(new Date(Date.now() - 90 * 86400000)); to.value = today;
    } else if (kind === 'ytd') {
      from.value = fmt(new Date(now.getFullYear(), 0, 1)); to.value = today;
    }
    ui.applyFilter();
  },

  async loadClienteStats(id) {
    state.clienteId = id;
    const qs = ui._filterQs();
    const loading = $('#cl-loading');
    if (loading) loading.style.display = 'inline';
    try {
      const [stats, txs, links] = await Promise.all([
        api('/contactos/' + id + '/stats' + qs),
        api('/contactos/' + id + '/transactions' + qs),
        api('/contactos/' + id + '/links'),  // links no se filtran por fecha
      ]);
      state.txCache = txs;
      $('#cl-body').innerHTML = ui.renderClienteBody(stats, txs, links);
    } catch (e) {
      $('#cl-body').innerHTML = `<div class="card"><b style="color:#ff8a8a">Error:</b> ${e.message}</div>`;
    } finally {
      if (loading) loading.style.display = 'none';
    }
  },

    const from = $('#db-from')?.value || '';

    if (from) parts.push('from=' + encodeURIComponent(from));

    return parts.length ? '?' + parts.join('&') : '';
  },

  },

  setDashboardPreset(kind) {
    const from = $('#db-from'), to = $('#db-to');
    if (!from || !to) return;
    const now = new Date();
    const fmtD = d => d.toISOString().slice(0, 10);
    const today = fmtD(now);
    if (kind === 'all') { from.value = ''; to.value = ''; }
    else if (kind === 'today') { from.value = today; to.value = today; }
    else if (kind === 'week') {
      const dow = (now.getDay() + 6) % 7;
      const wkStart = new Date(now); wkStart.setDate(now.getDate() - dow);
      from.value = fmtD(wkStart); to.value = today;
    }
    else if (kind === 'month') {
      from.value = fmtD(new Date(now.getFullYear(), now.getMonth(), 1));
      to.value = today;
    }
    else if (kind === 'lastMonth') {
      from.value = fmtD(new Date(now.getFullYear(), now.getMonth() - 1, 1));
      to.value = fmtD(new Date(now.getFullYear(), now.getMonth(), 0));
    }
    else if (kind === '30d') { from.value = fmtD(new Date(Date.now() - 30 * 86400000)); to.value = today; }
    else if (kind === '90d') { from.value = fmtD(new Date(Date.now() - 90 * 86400000)); to.value = today; }
    else if (kind === 'ytd') { from.value = fmtD(new Date(now.getFullYear(), 0, 1)); to.value = today; }
    ui.applyDashboardFilter();
  },

  async downloadStatementPdf() {
    const id = state.clienteId;
    if (!id) { alert('Cliente no cargado'); return; }
    const filterQs = ui._filterQs();
    const includeQs = ui._pdfIncludeQs();
    const feePctRaw = $('#cl-fee-pct')?.value;
    const linksFlags = [];
    if ($('#pdf-links-activos')?.checked) linksFlags.push('activos');
    if ($('#pdf-links-inactivos')?.checked) linksFlags.push('inactivos');
    let qs = filterQs;
    const extra = [];
    if (includeQs) extra.push(includeQs);
    // Si el campo tiene cualquier valor (incluido "0") → incluir la línea Fee PayBridge en el PDF.
    if (feePctRaw !== '' && feePctRaw != null) extra.push('fee_pct=' + Number(feePctRaw));
    if (linksFlags.length) extra.push('links=' + linksFlags.join(','));
    if (extra.length) qs = qs ? qs + '&' + extra.join('&') : '?' + extra.join('&');
    const url = '/api/paybridge/contactos/' + id + '/statement.pdf' + qs;
    const status = $('#cl-loading');
    if (status) { status.textContent = 'generando PDF…'; status.style.display = 'inline'; }
    try {
      const r = await fetch(url);  // wrapper inyecta Authorization
      if (!r.ok) {
        const txt = await r.text().catch(() => '');
        throw new Error(`HTTP ${r.status}: ${txt.slice(0, 200)}`);
      }
      const blob = await r.blob();
      const blobUrl = URL.createObjectURL(blob);
      // Disparar descarga + abrir en pestaña nueva
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `estado-cuenta-${id}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.open(blobUrl, '_blank');
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    } catch (e) {
      alert('Error generando PDF: ' + e.message);
    } finally {
      if (status) { status.textContent = 'cargando…'; status.style.display = 'none'; }
    }
  },

  filterTxTable() {
    const filters = [...document.querySelectorAll('.tx-col-filter')]
      .map(i => ({ idx: Number(i.dataset.col), q: i.value.toLowerCase().trim() }))
      .filter(f => f.q);
    const rows = document.querySelectorAll('#tx-tbody tr[data-row="1"]');
    let visible = 0;
    rows.forEach(tr => {
      const cells = tr.querySelectorAll('td');
      const show = filters.every(f => {
        const cell = cells[f.idx];
        return cell && cell.textContent.toLowerCase().includes(f.q);
      });
      tr.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    const counter = $('#tx-count');
    if (counter) counter.textContent = `${visible} de ${rows.length}`;
  },

  renderBarChart(serie, moneda) {
    if (!serie.length) return '';
    const W = 720, H = 200, padL = 50, padB = 26, padT = 14, padR = 12;
    const maxBruto = Math.max(...serie.map(r => Number(r.bruto)));
    const maxFee   = Math.max(...serie.map(r => Number(r.fee)));
    const max = Math.max(maxBruto, maxFee, 1);
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;
    const bw = innerW / serie.length;
    const y = v => padT + innerH - (Number(v) / max) * innerH;
    const fmtY = v => {
      try { return new Intl.NumberFormat('es-AR', { notation:'compact' }).format(Number(v||0)); }
      catch { return Math.round(v).toString(); }
    };
    const ticks = [0, max/2, max].map(v => `
      <line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="#1f2a44" stroke-dasharray="2,3"/>
      <text x="${padL-6}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="#6e82a9">${fmtY(v)}</text>`).join('');

    const bars = serie.map((r, i) => {
      const cx = padL + i * bw;
      const gw = bw * 0.36;
      const fy = y(r.bruto);
      const fy2 = y(r.fee);
      return `
        <rect x="${cx + bw*0.10}" y="${fy}" width="${gw}" height="${padT+innerH-fy}" fill="#3b82f6" opacity="0.85"><title>${r.mes} bruto: ${fmt(r.bruto, moneda)}</title></rect>
        <rect x="${cx + bw*0.54}" y="${fy2}" width="${gw}" height="${padT+innerH-fy2}" fill="#f59e0b" opacity="0.85"><title>${r.mes} fee: ${fmt(r.fee, moneda)}</title></rect>
        <text x="${cx + bw/2}" y="${H-8}" text-anchor="middle" font-size="9" fill="#8ea0c2">${r.mes.slice(2)}</text>
      `;
    }).join('');

    return `
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <b style="font-size:12px;color:#cfe1ff">${moneda} · bruto vs comisión por mes</b>
          <div style="font-size:11px;color:#8ea0c2">
            <span style="display:inline-block;width:10px;height:10px;background:#3b82f6;border-radius:2px;vertical-align:middle"></span> Bruto
            &nbsp;&nbsp;
            <span style="display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:2px;vertical-align:middle"></span> Fee
          </div>
        </div>
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">
          ${ticks}
          ${bars}
          <line x1="${padL}" x2="${W-padR}" y1="${padT+innerH}" y2="${padT+innerH}" stroke="#3b4d77"/>
        </svg>
      </div>`;
  },
};

async function render(n, ...args) {
  document.querySelectorAll('.side a').forEach(a => a.classList.toggle('active', a.dataset.tab === n));
  try {
    $('#main').innerHTML = await tabs[n](...args);
    if (n === 'cliente' && args[0]) ui.loadClienteStats(args[0]);
    if (n === 'dashboard') ui.loadDashboard();
  } catch (e) {
    $('#main').innerHTML = `<div class="card"><b style="color:#ff8a8a">Error:</b> ${e.message}</div>`;
  }
}
document.querySelectorAll('.side a[data-tab]').forEach(a => a.addEventListener('click', () => render(a.dataset.tab)));
render('dashboard');
</script>
</body>
</html>
