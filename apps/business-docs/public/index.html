<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arman Travel - Sistema de Documentos</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 0 1px rgba(0,0,0,.06);
        }

        .header {
            background: #1e1e2e;
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            justify-content: space-between;
            border-bottom: 3px solid #7B2CBF;
        }

        .header .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255,255,255,.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.15s ease;
            white-space: nowrap;
            text-decoration: none;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .header .brand img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 6px;
        }

        .header h1 {
            font-size: 18px;
            margin-bottom: 0;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.6;
            margin: 0;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
            overflow-x: auto;
        }

        .tab-button {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-button:hover {
            background: #f8f9fa;
            color: #1e1e2e;
        }

        .tab-button.active {
            color: #7B2CBF;
            border-bottom-color: #7B2CBF;
            background: transparent;
        }

        .tab-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            color: #999;
            position: relative;
        }

        .tab-button:disabled:hover {
            background: none;
            color: #999;
        }

        .coming-soon {
            display: block;
            font-size: 9px;
            font-style: italic;
            font-weight: 400;
            color: #999;
            margin-top: 2px;
        }

        .content {
            padding: 24px;
            min-height: 400px;
        }

        /* Formulario */
        .form-section {
            background: #fafbfc;
            border: 1px solid #e5e7eb;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .section-title {
            color: #374151;
            font-size: 13px;
            font-weight: 700;
            margin: 0 0 14px 0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #475569;
            font-size: 12px;
            letter-spacing: 0.2px;
        }

        .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s ease;
            background: #fff;
            color: #1e293b;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #7B2CBF;
            box-shadow: 0 0 0 3px rgba(123, 44, 191, 0.1);
        }

        input::placeholder, textarea::placeholder {
            color: #94a3b8;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
            font-family: inherit;
        }

        /* Items */
        .items-input-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-add-item {
            background: #7B2CBF;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-add-item:hover {
            background: #6A1B9A;
        }

        #itemsList {
            display: grid;
            gap: 10px;
        }

        .item-row {
            display: grid;
            grid-template-columns: 1fr 70px 110px 110px 40px;
            gap: 10px;
            align-items: center;
            background: white;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .remove-item {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #d1d5db;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            padding: 0;
        }

        .remove-item:hover {
            background: #fee2e2;
            color: #ef4444;
            border-color: #ef4444;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .items-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }

        .items-section h3 {
            color: #7B2CBF;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .add-item-btn {
            background: #7B2CBF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .add-item-btn:hover {
            background: #6A1B9A;
        }

        .total-section {
            background: #1e1e2e;
            color: white;
            padding: 16px 20px;
            border-radius: 8px;
            margin: 20px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: center;
        }

        .total-value {
            font-size: 28px;
            font-weight: 700;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px solid #e0e0e0;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #7B2CBF;
            color: white;
        }

        .btn-primary:hover {
            background: #6A1B9A;
        }

        .btn-secondary {
            background: #fff;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #7B2CBF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
            }

            .tab-button {
                flex: 0 0 auto;
                min-width: 120px;
            }

            .item-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .total-section {
                grid-template-columns: 1fr;
            }
        }

        /* PAYMENT METHODS */
        .payment-methods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .payment-method-btn {
            padding: 10px 12px;
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .payment-method-btn:hover {
            border-color: #7B2CBF;
            background: #f0e6ff;
        }

        .payment-method-btn.active {
            background: #7B2CBF;
            color: white;
            border-color: #7B2CBF;
        }

        /* MULTISELECT */
        .multiselect-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 10px;
        }

        .multiselect-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: all 0.3s ease;
            user-select: none;
        }

        .multiselect-option:hover {
            border-color: #7B2CBF;
            background: #f0e6ff;
        }

        .multiselect-option input[type="checkbox"] {
            cursor: pointer;
            accent-color: #7B2CBF;
        }

        .multiselect-option input[type="checkbox"]:checked + span {
            font-weight: 700;
            color: #7B2CBF;
        }

        /* IMAGE UPLOAD SECTION */
        .image-upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }

        .image-upload-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .image-upload-card:hover {
            border-color: #7B2CBF;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.1);
        }

        .image-upload-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .image-size-select {
            padding: 6px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: white;
            color: #7B2CBF;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .image-size-select:hover {
            border-color: #7B2CBF;
        }

        .image-size-select:focus {
            outline: none;
            border-color: #7B2CBF;
            box-shadow: 0 0 0 3px rgba(123, 44, 191, 0.1);
        }

        .image-preview-container {
            min-height: 100px;
            border: 2px dashed #e0e0e0;
            border-radius: 6px;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-preview {
            position: relative;
            width: 100%;
            text-align: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        .remove-preview-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .remove-preview-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .image-preview-container:empty::before {
            content: "Sin imagen cargada";
            color: #999;
            font-size: 12px;
            font-style: italic;
        }

        /* ===== SECCIONES DINÁMICAS POR CATEGORÍA ===== */
        .category-detail-section {
            transition: opacity 0.4s ease, max-height 0.4s ease, margin 0.4s ease, padding 0.4s ease;
            overflow: hidden;
        }

        .category-section-entering {
            opacity: 0;
            max-height: 0;
            margin-bottom: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
        }

        .category-section-exiting {
            opacity: 0;
            max-height: 0 !important;
            margin-bottom: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            transition: all 0.3s ease;
        }

        .category-detail-section .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-icon {
            font-size: 18px;
            line-height: 1;
        }

        /* Sub-item forms */
        .sub-items-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sub-item-form {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            position: relative;
            transition: border-color 0.2s ease;
        }

        .sub-item-form:hover {
            border-color: #c4a0e8;
        }

        .sub-item-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .sub-item-title {
            font-size: 13px;
            font-weight: 700;
            color: #7B2CBF;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .sub-item-price-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .sub-item-price-group label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin: 0;
        }

        .sub-item-price {
            width: 120px;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            text-align: right;
        }

        .sub-item-price:focus {
            border-color: #7B2CBF;
            outline: none;
            box-shadow: 0 0 0 2px rgba(123, 44, 191, 0.15);
        }

        .remove-subitem-btn {
            background: #ff4d4f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .remove-subitem-btn:hover {
            background: #d32f2f;
        }

        .btn-add-subitem {
            background: #f3e5f5;
            color: #7B2CBF;
            border: 2px dashed #c4a0e8;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-add-subitem:hover {
            background: #e8d0f5;
            border-color: #7B2CBF;
        }

        /* Autocomplete de aeropuertos */
        .airport-autocomplete-wrapper {
            position: relative;
            width: 100%;
        }

        .airport-autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #7B2CBF;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 260px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: none;
        }

        .airport-autocomplete-dropdown.visible {
            display: block;
        }

        .airport-option {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s ease;
            line-height: 1.4;
        }

        .airport-option:last-child {
            border-bottom: none;
        }

        .airport-option:hover,
        .airport-option.highlighted {
            background: #f3e5f5;
        }

        .airport-option .airport-code {
            font-weight: 700;
            color: #7B2CBF;
            font-size: 14px;
            margin-right: 6px;
        }

        .airport-option .airport-city {
            font-weight: 600;
            color: #333;
        }

        .airport-option .airport-country {
            font-size: 12px;
            color: #999;
            margin-left: 4px;
        }

        .airport-option .airport-name {
            font-size: 11px;
            color: #888;
            display: block;
            margin-top: 2px;
        }

        /* Campos auto-calculados (readonly) */
        input[readonly].auto-calculated {
            background: #f0e6ff !important;
            border-color: #d1b3ff !important;
            color: #7B2CBF !important;
            font-weight: 600;
            cursor: default;
        }

        /* Image upload dentro de sección de categoría */
        .category-detail-section .image-upload-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .category-detail-section .image-upload-card:hover {
            border-color: #7B2CBF;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.1);
        }

    </style>

    <!-- Modal de Configuración de Empresa -->
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: #fff;
            margin: 3% auto;
            padding: 24px;
            border-radius: 12px;
            width: 94%;
            max-width: 780px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.25s ease;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-header h2 {
            color: #1e1e2e;
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .modal-body .form-group {
            grid-column: 1 / -1;
        }

        .modal-body .form-group.half {
            grid-column: auto;
        }

        .modal-footer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .modal-footer button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-footer .btn-save {
            background: #7B2CBF;
            color: white;
        }

        .modal-footer .btn-save:hover {
            background: #6A1B9A;
        }

        .modal-footer .btn-cancel {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .modal-footer .btn-cancel:hover {
            background: #e8e8e8;
        }

        /* ===== BRANDING ARMAN SOLUTIONS (Cotizador tech) ===== */
        body.brand-solutions { background: #f0f2f5; }

      // Bridge entre la sidebar nueva (Tech-style) y los tabs viejos del cotizador.
      // Click en sidebar tab → click programatico en el .tab-button correspondiente.
      // Cambio de .tab-button.active → reflejarlo en sidebar.
      (function () {
        function syncSidebarFromTabs() {
          const active = document.querySelector('.tabs .tab-button.active');
          if (!active) return;
          const name = active.dataset.tab;
          document.querySelectorAll('.arman-side .arman-tab').forEach(b => {
            b.classList.toggle('active', b.dataset.armanTab === name);
          });
        }
        document.querySelectorAll('.arman-side .arman-tab[data-arman-tab]').forEach(btn => {
          btn.addEventListener('click', () => {
            const name = btn.dataset.armanTab;
            const real = document.querySelector(`.tabs .tab-button[data-tab="${name}"]`);
            if (real && !real.disabled) real.click();
          });
        });
        new MutationObserver(syncSidebarFromTabs).observe(
          document.querySelector('.tabs') || document.body,
          { subtree: true, attributes: true, attributeFilter: ['class'] }
        );
        syncSidebarFromTabs();
      })();
    </script>
</body>
</html>
