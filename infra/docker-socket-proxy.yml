# Proxy de solo lectura al socket de Docker, para el monitor /infra de business-docs.
# Expone solo GET /containers/* (listado y stats) y GET /system/df (tamano de
# volumenes, para medir las bases Postgres). Sin POST: no puede crear, borrar
# ni reiniciar nada. No publica puertos al exterior.
#
# Levantar en el servidor (una sola vez):
#   docker compose -f docker-socket-proxy.yml up -d
# business-docs lo encuentra en http://docker-socket-proxy:2375 (red "coolify").

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      SYSTEM: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - coolify
    mem_limit: 64m

networks:
  coolify:
    external: true
